name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build XrealScreen.slnx -c Release -p:Platform=x64

      - name: Test
        run: dotnet test --solution XrealScreen.slnx -c Release --no-build
